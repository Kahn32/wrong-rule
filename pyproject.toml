[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wrongrule"
version = "0.1.0"
description = "Controlled PyTorch experiments on regularization and compositional transfer"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.24", "matplotlib>=3.8", "scipy>=1.10"]

[project.scripts]
wrongrule = "wrongrule.cli:main"

[tool.setuptools.packages.find]
include = ["wrongrule*"]
